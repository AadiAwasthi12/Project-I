<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Gallery_Style.css">
    <script src="script.js" ></script>
    <script src="gallery.js" ></script>
</head>

<body>
      <header>
        <nav>
            <div class="nav-top">
                <div class="logo">
                    <img src="Images/logo.png" alt="Flourish Logo">
                </div>

                <button id="hamburger-btn" onclick="toggleMenu()" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>

            <ul id="nav-menu">
                <li><a href="home.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="About_us.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="login-link">Login</a></li>
                <li><button id="cart-btn" onclick="toggleCart()">🛒</button></li>
            </ul>
        </nav>
    </header>
    <main>

        <section class="gallery">

            <div class="container">

                <div class="card">

                    <img src="./images/Rose.jpg" alt="Tulip">

                    <h3>rose</h3>

                    <p>$30</p>

                    <p class="stock" id="stock0">
                        Stock : 10
                    </p>

                    <div class="quantity">

                        <button onclick="decrease(0)">-</button>

                        <span id="qty0">1</span>

                        <button onclick="increase(0)">+</button>

                    </div>

                    <button class="order" id="btn0" onclick="addToCart(0)">
                        Add to Cart
                    </button>

                </div>

                <div class="card">

                    <img src="./images/Daisy.jpg" alt="Tulip">

                    <h3>Daisy Collection</h3>

                    <p>$30</p>

                    <p class="stock" id="stock1">
                        Stock : 10
                    </p>

                    <div class="quantity">

                        <button onclick="decrease(1)">-</button>

                        <span id="qty1">1</span>

                        <button onclick="increase(1)">+</button>

                    </div>

                    <button class="order" id="btn1" onclick="addToCart(1)">
                        Add to Cart
                    </button>

                </div>

                <div class="card">

                    <img src="./images/lavander.jpg" alt="Tulip">

                    <h3>Lavander Collection</h3>

                    <p>$30</p>

                    <p class="stock" id="stock2">
                        Stock : 10
                    </p>

                    <div class="quantity">

                        <button onclick="decrease(2)">-</button>

                        <span id="qty2">1</span>

                        <button onclick="increase(2)">+</button>

                    </div>

                    <button class="order" id="btn2" onclick="addToCart(2)">
                        Add to Cart
                    </button>

                </div>


            </div>

        </section>

    </main>

    
    <div id="cart-overlay" onclick="toggleCart()"></div>

    
    <aside id="cart-panel">

        <div class="cart-header">
            <h2>Shopping Cart</h2>

            <button id="close-cart" onclick="toggleCart()">
                ✖
            </button>
        </div>

        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>

        <hr>

        <h3>
            Total : $
            <span id="total-price">0</span>
        </h3>

        <button id="checkout-btn" onclick="checkout()">
            Confirm
        </button>

    </aside>

    <footer>
        <p>© 2026 Flourish Flower Shop</p>
    </footer>
<script src="script.js" ></script>
    <script src="gallery.js" ></script>
</body>


</html>
